packages:
  - 'cli'
  - 'server'
  - 'mcp'

# Supply-chain hardening (pnpm 10 reads these here, not from package.json)
minimumReleaseAge: 1440
verifyStoreIntegrity: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - esbuild
  - unrs-resolver

overrides:
  lodash: 'npm:lodash-es@^4.17.21'
  path-to-regexp: '>=8.4.2'
  ip-address: '10.3.1'
  hono: '4.12.34'
  fast-uri: '3.1.5'
  picomatch: '>=4.0.4'
  serialize-javascript: '>=7.0.5'
  qs: '>=6.15.2'
  js-yaml: '4.3.1'
  multer: '>=2.2.0'
  vite: '7.3.6'
  postcss: '8.5.23'
  '@modelcontextprotocol/sdk>ajv': '8.18.0'
  '@angular-devkit/core>ajv': '8.18.0'
  'minimatch@3>brace-expansion': '1.1.18'
  'minimatch@9>brace-expansion': '2.1.4'
  'minimatch@10>brace-expansion': '5.0.9'
  '@hono/node-server': '1.19.15'
  'express@4>body-parser': '1.20.6'
  'express@5>body-parser': '2.3.0'
  form-data: '4.0.6'
  '@babel/core': '7.29.6'
